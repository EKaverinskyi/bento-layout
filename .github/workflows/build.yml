name: Build

# Builds binaries for all target platforms and uploads them as artifacts.
# Branch pushes: built alongside CI.
# Version tags: CI must pass first (tag -> CI -> build -> artifacts).
# Artifacts are kept 30 days; permanent downloads belong in a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # ci is skipped on branches (it has its own workflow trigger there); a failed or cancelled ci blocks the build.
    if: ${{ !cancelled() && needs.ci.result != 'failure' }}
    timeout-minutes: 10
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 } # best effort
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 } # best effort
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make build BIN=bento-layout-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bento-layout-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bento-layout-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30
          if-no-files-found: error
